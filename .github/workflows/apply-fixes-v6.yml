name: apply-blocker-fixes-v6

on:
  push:
    branches: [feat/first-vertical-slice]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/first-vertical-slice
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked toolchains
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation .
          npm ci
      - name: Apply focused fixes
        run: |
          awk '/^          cat > \/tmp\/apply_fixes.py/{flag=1; next} /^          PY$/{flag=0} flag{sub(/^          /, ""); print}' .github/workflows/lockgen.yml > /tmp/apply_fixes.py
          test -s /tmp/apply_fixes.py
          python - <<'PY'
          from pathlib import Path

          script = Path('/tmp/apply_fixes.py')
          text = script.read_text(encoding='utf-8')
          for path, variable in (
              ('tests/test_api.py', 'api_tests'),
              ('tests/test_persistence.py', 'concurrency_test'),
              ('e2e/critical-cart.spec.js', 'e2e_test'),
          ):
              bad = (
                  f'Path("{path}").write_text(\\n'
                  f'              Path("{path}").read_text(encoding="utf-8") + {variable},\\n'
                  '              encoding="utf-8",\\n'
                  '          )'
              )
              good = (
                  f'Path("{path}").write_text(\n'
                  f'              Path("{path}").read_text(encoding="utf-8") + {variable},\n'
                  '              encoding="utf-8",\n'
                  '          )'
              )
              if bad not in text:
                  raise SystemExit(f'missing encoded write_text block: {path}')
              text = text.replace(bad, good)
          script.write_text(text, encoding='utf-8')
          PY
          python -m py_compile /tmp/apply_fixes.py
          python /tmp/apply_fixes.py
          sed -i 's/--no-deps --no-build-isolation -e \./--no-deps --no-build-isolation ./g' .github/workflows/ci.yml .github/workflows/e2e.yml docs/setup.md
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/app.js')
          text = path.read_text(encoding='utf-8')
          functions = ('addBarcode(barcode, idempotencyKey)', 'updateQuantity(barcode, quantity)', 'removeItem(barcode)')
          for signature in functions:
              start = text.index(f'async function {signature} {{')
              end = text.find('\nasync function ', start + 1)
              if end == -1:
                  end = len(text)
              segment = text[start:end]
              old_guard = f'async function {signature} {{\n  if (!canMutateSession()) return;'
              new_guard = f'async function {signature} {{\n  const credentials = sessionCredentials;\n  if (!credentials || sessionState !== "active") return;'
              if old_guard not in segment:
                  raise SystemExit(f'missing mutation guard: {signature}')
              segment = segment.replace(old_guard, new_guard, 1)
              old_credential = '${sessionCredentials.sessionId}'
              if old_credential not in segment:
                  raise SystemExit(f'missing scoped session credential use: {signature}')
              segment = segment.replace(old_credential, '${credentials.sessionId}', 1)
              text = text[:start] + segment + text[end:]
          helper = '''function canMutateSession() {\n  return sessionCredentials !== null && sessionState === "active";\n}\n\n'''
          if helper not in text:
              raise SystemExit('missing canMutateSession helper')
          path.write_text(text.replace(helper, '', 1), encoding='utf-8')
          PY
          python -m ruff check --fix tests/test_api.py tests/test_persistence.py
          python -m ruff format src/varemi_go/api/app.py src/varemi_go/persistence/sqlite.py tests/test_api.py tests/test_persistence.py
          npx prettier --write apps/web/src/app.js apps/web/src/scanner.js apps/web/src/lib/scanner-utils.js apps/web/src/lib/scanner-utils.test.js e2e/critical-cart.spec.js
          python -m pip install --force-reinstall --no-deps --no-build-isolation .
      - name: Focused regressions
        run: |
          pytest --no-cov tests/test_api.py tests/test_persistence.py tests/test_barcodes.py
          npm run web:test
      - name: Full repository gates
        run: |
          ruff format --check .
          ruff check .
          mypy
          pytest
          npm run web:format:check
          npm run web:lint
          npm run web:typecheck
          npm run web:build
          python -m pip_audit
          npm audit --audit-level=high
          python -m pip check
      - name: Critical E2E
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Stage verified commit object and remove temporary workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git rm .github/workflows/lockgen.yml .github/workflows/apply-fixes-v2.yml .github/workflows/apply-fixes-v3.yml .github/workflows/apply-fixes-v4.yml .github/workflows/apply-fixes-v5.yml .github/workflows/apply-fixes-v6.yml
          git add -A
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()

          def request(path, payload):
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          entries = []
          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', '-z']
          ).decode().split('\0')
          i = 0
          while i < len(changed) and changed[i]:
              status = changed[i]
              path = changed[i + 1]
              i += 2
              if status.startswith('D'):
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode = subprocess.check_output(
                  ['git', 'ls-files', '-s', '--', path], text=True
              ).split()[0]
              content = base64.b64encode(Path(path).read_bytes()).decode()
              blob = request('/git/blobs', {'content': content, 'encoding': 'base64'})
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})

          tree = request('/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = request(
              '/git/commits',
              {
                  'message': 'fix(mvp): resolve verified PR blockers',
                  'tree': tree['sha'],
                  'parents': [parent],
              },
          )
          print(f"FINAL_COMMIT_SHA={commit['sha']}")
          print(f"FINAL_TREE_SHA={tree['sha']}")
          PY
