name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-flow:
    name: mobile-critical-flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip check
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E and capture visual review output
        run: |
          set -o pipefail
          npm run e2e | tee /tmp/varemi-e2e.log
      - name: Decode mobile visual review screenshots
        run: |
          mkdir -p /tmp/visual
          sed -n 's/^.*VAREMI_VISUAL_COUNT_EMPTY_390://p' /tmp/varemi-e2e.log | tail -n 1 | base64 --decode > /tmp/visual/count-empty-390.png
          sed -n 's/^.*VAREMI_VISUAL_COUNT_EMPTY_320://p' /tmp/varemi-e2e.log | tail -n 1 | base64 --decode > /tmp/visual/count-empty-320.png
          sed -n 's/^.*VAREMI_VISUAL_COUNT_POPULATED_390://p' /tmp/varemi-e2e.log | tail -n 1 | base64 --decode > /tmp/visual/count-populated-390.png
          test -s /tmp/visual/count-empty-390.png
          test -s /tmp/visual/count-empty-320.png
          test -s /tmp/visual/count-populated-390.png
      - name: Upload mobile visual review screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-review-count-placement
          path: /tmp/visual/*.png
          if-no-files-found: error
          retention-days: 1
