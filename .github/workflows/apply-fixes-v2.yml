name: apply-blocker-fixes-v2

on:
  push:
    branches: [feat/first-vertical-slice]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/first-vertical-slice
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked toolchains
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation .
          npm ci
      - name: Apply focused fixes
        run: |
          awk '/^          cat > \/tmp\/apply_fixes.py/{flag=1; next} /^          PY$/{flag=0} flag{sub(/^          /, ""); print}' .github/workflows/lockgen.yml > /tmp/apply_fixes.py
          test -s /tmp/apply_fixes.py
          python /tmp/apply_fixes.py
          sed -i 's/--no-deps --no-build-isolation -e \./--no-deps --no-build-isolation ./g' .github/workflows/ci.yml .github/workflows/e2e.yml docs/setup.md
          python -m ruff format src/varemi_go/api/app.py src/varemi_go/persistence/sqlite.py tests/test_api.py tests/test_persistence.py
          npx prettier --write apps/web/src/app.js apps/web/src/scanner.js apps/web/src/lib/scanner-utils.js apps/web/src/lib/scanner-utils.test.js e2e/critical-cart.spec.js
      - name: Focused regressions
        run: |
          pytest --no-cov tests/test_api.py tests/test_persistence.py tests/test_barcodes.py
          npm run web:test
      - name: Full repository gates
        run: |
          ruff format --check .
          ruff check .
          mypy
          pytest
          npm run web:format:check
          npm run web:lint
          npm run web:typecheck
          npm run web:build
          python -m pip_audit
          npm audit --audit-level=high
          python -m pip check
      - name: Critical E2E
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Commit verified fixes and remove temporary workflows
        run: |
          git rm .github/workflows/lockgen.yml .github/workflows/apply-fixes-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(mvp): resolve verified PR blockers'
          git push origin HEAD:feat/first-vertical-slice
