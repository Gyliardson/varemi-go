name: apply-blocker-fixes

on:
  push:
    branches: [feat/first-vertical-slice]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/first-vertical-slice
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked toolchains
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          npm ci
      - name: Apply focused fixes
        run: |
          cat > /tmp/apply_fixes.py <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern missing in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          # API: one direct error contract, strict request models, pre-provider idempotency replay.
          replace(
              "src/varemi_go/api/app.py",
              "from fastapi import Cookie, Depends, FastAPI, Header, HTTPException, Response, status\nfrom fastapi.responses import FileResponse\n",
              "from fastapi import Cookie, Depends, FastAPI, Header, HTTPException, Request, Response, status\nfrom fastapi.exceptions import RequestValidationError\nfrom fastapi.responses import FileResponse, JSONResponse\n",
          )
          replace(
              "src/varemi_go/api/app.py",
              "    model_config = ConfigDict(populate_by_name=True)\n",
              "    model_config = ConfigDict(populate_by_name=True, extra=\"forbid\")\n",
          )
          replace(
              "src/varemi_go/api/app.py",
              "class ErrorBody(ApiModel):\n    code: str\n    message: str\n\n\nclass StoreResponse",
              "class ErrorBody(ApiModel):\n    code: str\n    message: str\n\n\nclass ApiHttpError(HTTPException):\n    pass\n\n\nclass StoreResponse",
          )
          replace(
              "src/varemi_go/api/app.py",
              "    app.state.context = context\n\n    @app.get(\"/api/health\", response_model=HealthResponse)\n",
              "    app.state.context = context\n\n    @app.exception_handler(ApiHttpError)\n    def api_http_error_handler(_request: Request, error: ApiHttpError) -> JSONResponse:\n        return JSONResponse(status_code=error.status_code, content=error.detail)\n\n    @app.exception_handler(RequestValidationError)\n    def validation_error_handler(\n        _request: Request, _error: RequestValidationError\n    ) -> JSONResponse:\n        return JSONResponse(\n            status_code=status.HTTP_422_UNPROCESSABLE_CONTENT,\n            content={\"code\": \"VALIDATION_ERROR\", \"message\": \"Request validation failed\"},\n        )\n\n    @app.get(\"/api/health\", response_model=HealthResponse)\n",
          )
          old_add = '''        try:\n            cart = context.repository.get_authorized_cart(session_id, token)\n            quote = context.provider.get_quote(cart.store, barcode)\n            request_hash = _request_fingerprint({"barcode": barcode})\n            updated_cart = context.repository.add_item(\n                session_id,\n                token,\n                quote,\n                idempotency_key=idempotency_key,\n                request_hash=request_hash,\n            )\n'''
          new_add = '''        request_hash = _request_fingerprint({"barcode": barcode})\n        try:\n            replay = context.repository.get_idempotent_add_result(\n                session_id,\n                token,\n                idempotency_key=idempotency_key,\n                request_hash=request_hash,\n            )\n            if replay is not None:\n                return _cart_response(replay)\n\n            cart = context.repository.get_authorized_cart(session_id, token)\n            quote = context.provider.get_quote(cart.store, barcode)\n            updated_cart = context.repository.add_item(\n                session_id,\n                token,\n                quote,\n                idempotency_key=idempotency_key,\n                request_hash=request_hash,\n            )\n'''
          replace("src/varemi_go/api/app.py", old_add, new_add)
          replace(
              "src/varemi_go/api/app.py",
              'responses={401: {"model": ErrorBody}, 404: {"model": ErrorBody}, 410: {"model": ErrorBody}},\n    )\n    def remove_item',
              'responses={\n            401: {"model": ErrorBody},\n            404: {"model": ErrorBody},\n            410: {"model": ErrorBody},\n            422: {"model": ErrorBody},\n        },\n    )\n    def remove_item',
          )
          replace(
              "src/varemi_go/api/app.py",
              "def _session_http_error(error: Exception) -> HTTPException:\n",
              "def _session_http_error(error: Exception) -> ApiHttpError:\n",
          )
          replace(
              "src/varemi_go/api/app.py",
              "def _http_error(status_code: int, code: str, message: str) -> HTTPException:\n    return HTTPException(status_code=status_code, detail={\"code\": code, \"message\": message})\n",
              "def _http_error(status_code: int, code: str, message: str) -> ApiHttpError:\n    return ApiHttpError(status_code=status_code, detail={\"code\": code, \"message\": message})\n",
          )

          # Persistence: authorized idempotency preflight outside provider call, atomic check remains in add_item.
          marker = '''    def add_item(\n        self,\n        session_id: str,\n'''
          method = '''    def get_idempotent_add_result(\n        self,\n        session_id: str,\n        token: str,\n        *,\n        idempotency_key: str,\n        request_hash: str,\n        now: datetime | None = None,\n    ) -> Cart | None:\n        current_time = now or utc_now()\n        with self._transaction() as connection:\n            self._authorize(connection, session_id, token)\n            self._require_active(connection, session_id, current_time)\n            existing_request = connection.execute(\n                \"\"\"\n                SELECT operation, request_hash FROM idempotency_requests\n                WHERE session_id = ? AND idempotency_key = ?\n                \"\"\",\n                (session_id, idempotency_key),\n            ).fetchone()\n            if existing_request is None:\n                return None\n            if existing_request[\"operation\"] != \"add-item\" or not hmac.compare_digest(\n                existing_request[\"request_hash\"], request_hash\n            ):\n                raise IdempotencyConflictError(idempotency_key)\n            return self._load_cart(connection, session_id)\n\n'''
          replace("src/varemi_go/persistence/sqlite.py", marker, method + marker)

          # Scanner: UPC-E is deliberately excluded because text-only eight digit payloads are ambiguous with EAN-8.
          scanner_utils = Path("apps/web/src/lib/scanner-utils.js")
          scanner_utils.write_text(
              scanner_utils.read_text(encoding="utf-8")
              + '''\n/** @type {(\"EAN_13\" | \"EAN_8\" | \"UPC_A\")[]} */\nexport const SUPPORTED_BARCODE_FORMATS = [\"EAN_13\", \"EAN_8\", \"UPC_A\"];\n''',
              encoding="utf-8",
          )
          replace(
              "apps/web/src/scanner.js",
              'import { createDuplicateGuard } from "./lib/scanner-utils.js";\n',
              'import {\n  createDuplicateGuard,\n  SUPPORTED_BARCODE_FORMATS,\n} from "./lib/scanner-utils.js";\n',
          )
          replace(
              "apps/web/src/scanner.js",
              ' * Starts a browser camera scanner. This integration is exercised with mocked browser boundaries in CI;\n * it is not evidence that physical device cameras were validated.\n',
              ' * Starts a browser camera scanner. CI covers pure scanner helpers and manual full-stack flow;\n * it does not validate ZXing camera integration or physical device cameras.\n',
          )
          replace(
              "apps/web/src/scanner.js",
              '''  hints.set(DecodeHintType.POSSIBLE_FORMATS, [\n    BarcodeFormat.EAN_13,\n    BarcodeFormat.EAN_8,\n    BarcodeFormat.UPC_A,\n    BarcodeFormat.UPC_E,\n  ]);\n''',
              '''  hints.set(\n    DecodeHintType.POSSIBLE_FORMATS,\n    SUPPORTED_BARCODE_FORMATS.map((format) => BarcodeFormat[format]),\n  );\n''',
          )
          replace(
              "apps/web/src/lib/scanner-utils.test.js",
              'import { cameraErrorMessage, createDuplicateGuard } from "./scanner-utils.js";\n',
              'import {\n  cameraErrorMessage,\n  createDuplicateGuard,\n  SUPPORTED_BARCODE_FORMATS,\n} from "./scanner-utils.js";\n',
          )
          replace(
              "apps/web/src/lib/scanner-utils.test.js",
              '  it("suppresses only immediate duplicate values", () => {\n',
              '''  it("keeps EAN-8 support distinct from unsupported UPC-E", () => {\n    expect(SUPPORTED_BARCODE_FORMATS).toContain("EAN_8");\n    expect(SUPPORTED_BARCODE_FORMATS).not.toContain("UPC_E");\n  });\n\n  it("suppresses only immediate duplicate values", () => {\n''',
          )

          # SPA: explicit active/ended/recovering session state and no silent replay of terminal mutations.
          replace(
              "apps/web/src/app.js",
              '''let sessionCredentials = readCredentials();\n/** @type {{ barcode: string, idempotencyKey: string } | null} */\n''',
              '''let sessionCredentials = readCredentials();\n/** @type {"recovering" | "active" | "ended"} */\nlet sessionState = "recovering";\n/** @type {{ barcode: string, idempotencyKey: string } | null} */\n''',
          )
          old_recover = '''async function recoverOrCreateSession() {\n  if (sessionCredentials) {\n    try {\n      return await apiRequest(`/api/sessions/${sessionCredentials.sessionId}`);\n    } catch (error) {\n      if (\n        !(error instanceof ApiError) ||\n        !["SESSION_NOT_FOUND", "CART_EXPIRED", "SESSION_UNAUTHORIZED"].includes(\n          error.code,\n        )\n      ) {\n        throw error;\n      }\n      localStorage.removeItem(storageKey);\n      sessionCredentials = null;\n    }\n  }\n\n  const created = await apiRequest(\n    `/api/stores/${encodeURIComponent(storeSlug)}/sessions`,\n    {\n      method: "POST",\n    },\n  );\n  sessionCredentials = { sessionId: created.cart.id };\n  localStorage.setItem(storageKey, JSON.stringify(sessionCredentials));\n  return created.cart;\n}\n'''
          new_recover = '''async function recoverOrCreateSession() {\n  if (sessionCredentials) {\n    try {\n      const cart = await apiRequest(\n        `/api/sessions/${sessionCredentials.sessionId}`,\n      );\n      sessionState = "active";\n      return cart;\n    } catch (error) {\n      if (!isTerminalSessionError(error)) throw error;\n      endSession();\n    }\n  }\n\n  sessionState = "recovering";\n  const created = await apiRequest(\n    `/api/stores/${encodeURIComponent(storeSlug)}/sessions`,\n    {\n      method: "POST",\n    },\n  );\n  sessionCredentials = { sessionId: created.cart.id };\n  localStorage.setItem(storageKey, JSON.stringify(sessionCredentials));\n  sessionState = "active";\n  return created.cart;\n}\n'''
          replace("apps/web/src/app.js", old_recover, new_recover)
          replace(
              "apps/web/src/app.js",
              'async function addBarcode(barcode, idempotencyKey) {\n  if (!sessionCredentials) return;\n',
              'async function addBarcode(barcode, idempotencyKey) {\n  if (!canMutateSession()) return;\n',
          )
          replace(
              "apps/web/src/app.js",
              '''    } else {\n      pendingAdd = null;\n      showError(error, "Não foi possível adicionar o produto.");\n    }\n  } finally {\n''',
              '''    } else if (isTerminalSessionError(error)) {\n      await recoverEndedSession(\n        "Sua sessão anterior foi encerrada. Uma nova compra foi iniciada; confirme para tentar adicionar o produto novamente.",\n        true,\n      );\n    } else {\n      pendingAdd = null;\n      showError(error, "Não foi possível adicionar o produto.");\n    }\n  } finally {\n''',
          )
          replace(
              "apps/web/src/app.js",
              'async function updateQuantity(barcode, quantity) {\n  if (!sessionCredentials) return;\n',
              'async function updateQuantity(barcode, quantity) {\n  if (!canMutateSession()) return;\n',
          )
          replace(
              "apps/web/src/app.js",
              '''  } catch (error) {\n    showError(error, "Não foi possível alterar a quantidade.");\n  } finally {\n''',
              '''  } catch (error) {\n    if (isTerminalSessionError(error)) {\n      await recoverEndedSession(\n        "Sua sessão anterior foi encerrada. Uma nova compra vazia foi iniciada.",\n        false,\n      );\n    } else {\n      showError(error, "Não foi possível alterar a quantidade.");\n    }\n  } finally {\n''',
          )
          replace(
              "apps/web/src/app.js",
              'async function removeItem(barcode) {\n  if (!sessionCredentials) return;\n',
              'async function removeItem(barcode) {\n  if (!canMutateSession()) return;\n',
          )
          replace(
              "apps/web/src/app.js",
              '''  } catch (error) {\n    showError(error, "Não foi possível remover o item.");\n  } finally {\n''',
              '''  } catch (error) {\n    if (isTerminalSessionError(error)) {\n      await recoverEndedSession(\n        "Sua sessão anterior foi encerrada. Uma nova compra vazia foi iniciada.",\n        false,\n      );\n    } else {\n      showError(error, "Não foi possível remover o item.");\n    }\n  } finally {\n''',
          )
          replace(
              "apps/web/src/app.js",
              '''  if (!response.ok) {\n    const detail = data.detail ?? data;\n    throw new ApiError(\n      detail.code ?? "REQUEST_FAILED",\n      detail.message ?? "Falha na requisição",\n    );\n  }\n''',
              '''  if (!response.ok) {\n    throw new ApiError(\n      data.code ?? "REQUEST_FAILED",\n      data.message ?? "Falha na requisição",\n    );\n  }\n''',
          )
          helper_marker = '''/** @param {unknown} error @param {string} fallback */\nfunction showError(error, fallback) {\n'''
          helpers = '''/** @param {unknown} error */\nfunction isTerminalSessionError(error) {\n  return (\n    error instanceof ApiError &&\n    ["SESSION_NOT_FOUND", "SESSION_UNAUTHORIZED", "CART_EXPIRED"].includes(\n      error.code,\n    )\n  );\n}\n\nfunction canMutateSession() {\n  return sessionCredentials !== null && sessionState === "active";\n}\n\nfunction endSession() {\n  sessionState = "ended";\n  closeCamera();\n  localStorage.removeItem(storageKey);\n  sessionCredentials = null;\n}\n\n/** @param {string} message @param {boolean} preservePendingAdd */\nasync function recoverEndedSession(message, preservePendingAdd) {\n  endSession();\n  setConnection("Recuperando");\n  try {\n    const cart = await recoverOrCreateSession();\n    renderCart(cart);\n    setConnection("Online");\n    elements.pendingAction.hidden = !preservePendingAdd;\n    elements.feedback.textContent = message;\n  } catch (error) {\n    setConnection("Indisponível");\n    showError(\n      error,\n      "A sessão foi encerrada e não foi possível iniciar uma nova compra.",\n    );\n  }\n}\n\n'''
          replace("apps/web/src/app.js", helper_marker, helpers + helper_marker)

          # API tests: direct error body + provider-independent replay + validation/expiry/OpenAPI contract.
          replace(
              "tests/test_api.py",
              "from fastapi.testclient import TestClient\n\n\n",
              "from datetime import UTC, datetime\n\nfrom fastapi.testclient import TestClient\n\nfrom varemi_go.api import create_app\nfrom varemi_go.catalog import DemoCatalogProvider\nfrom varemi_go.domain import CatalogQuote, Store\nfrom varemi_go.persistence import SqliteCartRepository\n\n\n",
          )
          replace("tests/test_api.py", '["detail"]["code"]', '["code"]')
          api_tests = '''\n\nclass ToggleCatalogProvider:\n    def __init__(self) -> None:\n        self._delegate = DemoCatalogProvider()\n        self.available = True\n        self.calls = 0\n\n    def get_quote(self, store: Store, barcode: str) -> CatalogQuote:\n        self.calls += 1\n        if not self.available:\n            raise RuntimeError("provider unavailable")\n        return self._delegate.get_quote(store, barcode)\n\n\ndef test_completed_idempotent_replay_does_not_call_provider_again(\n    repository: SqliteCartRepository,\n) -> None:\n    provider = ToggleCatalogProvider()\n    with TestClient(create_app(repository=repository, provider=provider)) as replay_client:\n        session_id = _create_session(replay_client)\n        headers = {"Idempotency-Key": "api-replay-0001"}\n        first = replay_client.post(\n            f"/api/sessions/{session_id}/items",\n            headers=headers,\n            json={"barcode": "7890000000017"},\n        )\n        assert first.status_code == 200\n        assert first.json()["items"][0]["quantity"] == 1\n        assert provider.calls == 1\n\n        provider.available = False\n        replay = replay_client.post(\n            f"/api/sessions/{session_id}/items",\n            headers=headers,\n            json={"barcode": "7890000000017"},\n        )\n        assert replay.status_code == 200\n        assert replay.json()["items"][0]["quantity"] == 1\n        assert provider.calls == 1\n\n        conflict = replay_client.post(\n            f"/api/sessions/{session_id}/items",\n            headers=headers,\n            json={"barcode": "7890000000024"},\n        )\n        assert conflict.status_code == 409\n        assert conflict.json() == {\n            "code": "IDEMPOTENCY_KEY_REUSED",\n            "message": "Idempotency key was already used for a different request",\n        }\n        assert provider.calls == 1\n\n\ndef test_error_wire_contract_and_openapi_match(\n    client: TestClient, repository: SqliteCartRepository\n) -> None:\n    missing_store = client.get("/api/stores/missing")\n    assert missing_store.status_code == 404\n    assert missing_store.json()["code"] == "STORE_NOT_FOUND"\n\n    store = repository.get_store_by_slug("demo-market")\n    expired_cart, token = repository.create_session(\n        store, now=datetime(2020, 1, 1, tzinfo=UTC)\n    )\n    expired = client.get(\n        f"/api/sessions/{expired_cart.id}",\n        headers={"Authorization": f"Bearer {token}"},\n    )\n    assert expired.status_code == 410\n    assert expired.json()["code"] == "CART_EXPIRED"\n\n    session_id = _create_session(client)\n    unauthorized = TestClient(client.app).get(f"/api/sessions/{session_id}")\n    assert unauthorized.status_code == 401\n    assert unauthorized.json()["code"] == "SESSION_UNAUTHORIZED"\n\n    validation = client.post(\n        f"/api/sessions/{session_id}/items",\n        headers={"Idempotency-Key": "api-validation-001"},\n        json={"barcode": "7890000000017", "price": 1},\n    )\n    assert validation.status_code == 422\n    assert validation.json() == {\n        "code": "VALIDATION_ERROR",\n        "message": "Request validation failed",\n    }\n\n    headers = {"Idempotency-Key": "api-contract-conflict"}\n    assert client.post(\n        f"/api/sessions/{session_id}/items",\n        headers=headers,\n        json={"barcode": "7890000000017"},\n    ).status_code == 200\n    conflict = client.post(\n        f"/api/sessions/{session_id}/items",\n        headers=headers,\n        json={"barcode": "7890000000024"},\n    )\n    assert conflict.status_code == 409\n    assert conflict.json()["code"] == "IDEMPOTENCY_KEY_REUSED"\n\n    openapi = client.get("/openapi.json").json()\n    responses = openapi["paths"][f"/api/sessions/{{session_id}}/items"]["post"][\n        "responses"\n    ]\n    for status_code in ("401", "404", "409", "410", "422"):\n        schema = responses[status_code]["content"]["application/json"]["schema"]\n        assert schema["$ref"] == "#/components/schemas/ErrorBody"\n'''
          Path("tests/test_api.py").write_text(\n              Path("tests/test_api.py").read_text(encoding="utf-8") + api_tests,\n              encoding="utf-8",\n          )

          # Persistence concurrency regression for same idempotency key.
          replace(
              "tests/test_persistence.py",
              "import sqlite3\nfrom datetime import UTC, datetime, timedelta\n",
              "import sqlite3\nfrom concurrent.futures import ThreadPoolExecutor\nfrom datetime import UTC, datetime, timedelta\nfrom threading import Barrier\n",
          )
          concurrency_test = '''\n\ndef test_concurrent_same_idempotency_key_commits_once(\n    repository: SqliteCartRepository,\n) -> None:\n    cart, token = _session(repository)\n    quote = DemoCatalogProvider().get_quote(cart.store, "7890000000017")\n    barrier = Barrier(2)\n\n    def add_once(_index: int) -> int:\n        barrier.wait()\n        result = repository.add_item(\n            cart.id,\n            token,\n            quote,\n            idempotency_key="request-concurrent",\n            request_hash="same-concurrent-hash",\n        )\n        return result.items[0].quantity\n\n    with ThreadPoolExecutor(max_workers=2) as pool:\n        quantities = list(pool.map(add_once, range(2)))\n\n    assert quantities == [1, 1]\n    persisted = repository.get_authorized_cart(cart.id, token)\n    assert persisted.items[0].quantity == 1\n'''
          Path("tests/test_persistence.py").write_text(\n              Path("tests/test_persistence.py").read_text(encoding="utf-8") + concurrency_test,\n              encoding="utf-8",\n          )

          # E2E: session expires while page is open; add is not silently replayed and keeps the key for explicit retry.
          e2e_test = '''\n\ntest("recovers an ended session during add without silently repeating the mutation", async ({\n  page,\n}) => {\n  const attempts = [];\n  let expireNextAdd = true;\n  await page.route("**/api/sessions/*/items", async (route) => {\n    if (route.request().method() !== "POST") {\n      await route.continue();\n      return;\n    }\n    attempts.push(route.request().headers()["idempotency-key"]);\n    if (expireNextAdd) {\n      expireNextAdd = false;\n      await route.fulfill({\n        status: 410,\n        contentType: "application/json",\n        body: JSON.stringify({\n          code: "CART_EXPIRED",\n          message: "Cart session has expired",\n        }),\n      });\n      return;\n    }\n    await route.continue();\n  });\n\n  await page.goto("/#/store/demo-market");\n  await expect(\n    page.getByRole("heading", { name: "Mercado Demo" }),\n  ).toBeVisible();\n  const sessionBefore = await page.evaluate(() =>\n    localStorage.getItem("varemi-go:demo-market:session"),\n  );\n\n  const barcode = page.getByLabel("Código de barras");\n  await barcode.fill("7890000000017");\n  await page.getByRole("button", { name: "Adicionar" }).click();\n\n  await expect(page.getByRole("status")).toContainText(\n    "Uma nova compra foi iniciada",\n  );\n  await expect(page.getByText("Seu carrinho está vazio.")).toBeVisible();\n  await expect(page.getByRole("button", { name: "Tentar novamente" })).toBeVisible();\n  expect(attempts).toHaveLength(1);\n  const sessionAfter = await page.evaluate(() =>\n    localStorage.getItem("varemi-go:demo-market:session"),\n  );\n  expect(sessionAfter).not.toBe(sessionBefore);\n\n  await page.getByRole("button", { name: "Tentar novamente" }).click();\n  await expect(page.getByText("Arroz Demo 1 kg")).toBeVisible();\n  expect(attempts).toHaveLength(2);\n  expect(attempts[1]).toBe(attempts[0]);\n});\n'''
          Path("e2e/critical-cart.spec.js").write_text(\n              Path("e2e/critical-cart.spec.js").read_text(encoding="utf-8") + e2e_test,\n              encoding="utf-8",\n          )

          # Reproducible installs in canonical CI/E2E.
          replace(
              ".github/workflows/ci.yml",
              "          cache: pip\n      - run: python -m pip install -e '.[dev]'\n",
              "          cache: pip\n          cache-dependency-path: requirements.lock\n      - run: python -m pip install -r requirements.lock\n      - run: python -m pip install --no-deps --no-build-isolation -e .\n      - run: python -m pip check\n      - run: pytest --no-cov tests/test_api.py tests/test_persistence.py tests/test_barcodes.py\n",
          )
          replace(".github/workflows/ci.yml", "      - run: npm install\n", "      - run: npm ci\n")
          replace(
              ".github/workflows/e2e.yml",
              "          cache: pip\n",
              "          cache: pip\n          cache-dependency-path: requirements.lock\n",
          )
          replace(
              ".github/workflows/e2e.yml",
              "      - run: python -m pip install -e '.[dev]'\n      - run: npm install\n",
              "      - run: python -m pip install -r requirements.lock\n      - run: python -m pip install --no-deps --no-build-isolation -e .\n      - run: python -m pip check\n      - run: npm ci\n",
          )

          # Documentation: implemented slice vs pending MVP vs post-MVP, setup truth, wire contract and camera claims.
          Path("docs/roadmap.md").write_text('''# Roadmap\n\n## 1. Vertical slice demo — implementado\n\n- QR/URL da loja demo;\n- sessão anônima/pseudônima com credencial separada do resource ID;\n- scanner mobile web para EAN-13, EAN-8 e UPC-A, além de entrada manual;\n- consulta autoritativa de produto/preço via provider demo;\n- carrinho persistido, idempotência e total autoritativo durante a compra;\n- recuperação de sessão encerrada no browser e fallback operacional para checkout tradicional.\n\nEsta slice demonstra o núcleo scan → preço autoritativo → carrinho. Ela ainda não implementa finalização nem handoff de checkout.\n\n## 2. Pilot readiness — ainda parte do MVP\n\nAntes do piloto, completar e validar:\n\n- finalização explícita do carrinho;\n- handoff seguro por QR/identificador;\n- recuperação autoritativa do carrinho pela estação de checkout;\n- integração real de catálogo/preço do primeiro varejista atrás do contrato de provider;\n- baseline do checkout atual;\n- instrumentação/observabilidade mínima para medir o piloto e investigar falhas;\n- fallback operacional testado.\n\n## 3. Piloto → evidência → expansão/refinamentos\n\nExecutar o piloto controlado, medir os resultados contra o baseline e somente então decidir refinamentos/expansão com base em evidência.\n\n## Fora do MVP inicial\n\n- processamento próprio de pagamento;\n- emissão fiscal própria;\n- visão computacional;\n- IA/Varemi AI;\n- analytics avançado/Varemi Insights;\n- prevenção de perdas automatizada;\n- app nativo.\n\nProdutos pesáveis e validações operacionais entram conforme a integração real do piloto exigir, sem pressupor formato universal. Nenhuma capacidade pendente ou futura deve ser apresentada como disponível hoje.\n''', encoding="utf-8")

          readme = Path("README.md").read_text(encoding="utf-8")
          readme = readme.replace("scanner web para EAN-13, EAN-8, UPC-A e UPC-E", "scanner web para EAN-13, EAN-8 e UPC-A")
          readme = readme.replace(
              "O teste automatizado do scanner cobre lógica/fallbacks, **não valida câmera física real**.\n\nFora do escopo: handoff para PDV, pagamento, emissão fiscal, self-checkout, antifraude avançado, visão computacional, IA, analytics sofisticado e aplicativo nativo.",
              "Os testes unitários do scanner cobrem apenas helpers puros; o E2E crítico usa entrada manual. A integração ZXing/câmera e **câmera física real não são validadas por CI**. UPC-E fica fora desta slice porque o payload textual de oito dígitos não preserva a symbology necessária para distingui-lo de EAN-8.\n\nAinda pertencem ao MVP, mas **não estão implementados nesta vertical slice**: finalização explícita, handoff seguro por QR/identificador e recuperação autoritativa do carrinho na estação de checkout.\n\nFora do MVP inicial: processamento próprio de pagamento, emissão fiscal própria, visão computacional, IA, analytics avançado e automação sofisticada de prevenção de perdas. A sequência é: vertical slice demo → pilot readiness (integração real + baseline + instrumentação/observabilidade mínima + fallback) → piloto → evidência → expansão/refinamentos.",
          )
          Path("README.md").write_text(readme, encoding="utf-8")

          setup = Path("docs/setup.md").read_text(encoding="utf-8")
          setup = setup.replace(
              "python -m pip install -e '.[dev]'\nnpm install\ncp .env.example .env\n",
              "python -m pip install -r requirements.lock\npython -m pip install --no-deps --no-build-isolation -e .\nnpm ci\n",
          )
          setup = setup.replace(
              "Em terminais separados:\n",
              "`.env.example` é apenas referência das variáveis suportadas. O runtime não carrega `.env` automaticamente; exporte/injete as variáveis no shell ou no processo quando precisar sobrescrever os defaults.\n\nEm terminais separados:\n",
          )
          setup = setup.replace(
              "O Playwright sobe API e Vite automaticamente, usa Chromium em viewport/touch mobile e cobre o fluxo crítico por entrada manual. Isso não constitui validação de câmera física.",
              "O Playwright sobe API e Vite automaticamente, usa Chromium em viewport/touch mobile e cobre o fluxo crítico por entrada manual, inclusive recuperação após sessão encerrada durante a página aberta. Os unit tests cobrem helpers puros do scanner; CI não exercita a integração ZXing/câmera e não constitui validação de câmera física real.",
          )
          Path("docs/setup.md").write_text(setup, encoding="utf-8")

          Path("docs/api.md").write_text('''# API da vertical slice\n\nA especificação OpenAPI é gerada pelo FastAPI. Endpoints atuais:\n\n| Método | Rota | Papel |\n| --- | --- | --- |\n| `GET` | `/api/health` | health check |\n| `GET` | `/api/stores/{slug}` | resolve a loja pública |\n| `POST` | `/api/stores/{slug}/sessions` | cria sessão/carrinho e cookie HttpOnly |\n| `GET` | `/api/sessions/{id}` | recupera carrinho autoritativo |\n| `POST` | `/api/sessions/{id}/items` | resolve replay idempotente ou consulta provider e adiciona barcode |\n| `PATCH` | `/api/sessions/{id}/items/{barcode}` | define quantidade positiva |\n| `DELETE` | `/api/sessions/{id}/items/{barcode}` | remove item |\n\n`POST .../items` exige `Idempotency-Key` e body com `barcode`. Os modelos de request rejeitam campos extras. Nenhum endpoint aceita preço ou total como autoridade do cliente.\n\nUm replay já commitado da mesma `Idempotency-Key` + mesmo barcode é resolvido pelo estado persistido sem nova consulta ao provider; a checagem é repetida atomicamente na transação de `add_item` para proteger races. Reuso da chave com payload diferente retorna 409.\n\nErros de API usam um único wire contract, também refletido no OpenAPI:\n\n```json\n{\n  "code": "CART_EXPIRED",\n  "message": "Cart session has expired"\n}\n```\n\nIsso vale para erros de domínio/autorização e para validação 422 (`VALIDATION_ERROR`). Códigos relevantes incluem `STORE_NOT_FOUND`, `SESSION_UNAUTHORIZED`, `SESSION_NOT_FOUND`, `CART_EXPIRED`, `INVALID_BARCODE`, `PRODUCT_NOT_FOUND`, `ITEM_NOT_FOUND` e `IDEMPOTENCY_KEY_REUSED`.\n\nO cookie web é uma forma de transportar a credencial pseudônima; o contrato de domínio/persistência não depende de cookie ou navegador.\n''', encoding="utf-8")

          adr = Path("docs/adr/0003-barcode-scanning.md").read_text(encoding="utf-8")
          adr = adr.replace("- UPC-A;\n- UPC-E.", "- UPC-A.\n\nUPC-E não é habilitado nesta slice. O callback atual transporta somente o texto lido; um UPC-E de oito dígitos ficaria indistinguível de EAN-8 no backend. Suporte futuro exige preservar a symbology e canonicalizar UPC-E para a identidade GTIN-12 correspondente antes de fazer claim de suporte.")
          adr = adr.replace(
              "Testes automatizados de callback/fallback não serão descritos como teste de câmera física.",
              "CI cobre helpers puros do scanner e o fluxo E2E por entrada manual. A integração ZXing/câmera não é simulada como se fosse cobertura real, e testes automatizados não serão descritos como validação de câmera física.",
          )
          Path("docs/adr/0003-barcode-scanning.md").write_text(adr, encoding="utf-8")

          architecture = Path("docs/architecture.md").read_text(encoding="utf-8")
          architecture = architecture.replace(
              "A adição por scan exige `Idempotency-Key`. Repetir a mesma chave com o mesmo payload não incrementa novamente; reutilizar a chave para outro payload retorna conflito.",
              "A adição por scan exige `Idempotency-Key`. Replay já commitado da mesma chave/payload é resolvido da persistência antes de chamar o provider; a mesma checagem permanece dentro da transação de `add_item` para races. Repetir a mesma chave não incrementa novamente; reutilizá-la para outro payload retorna conflito. Nenhuma transação SQLite permanece aberta durante consulta externa ao provider.",
          )
          architecture = architecture.replace(
              "Cada adição consulta novamente o provider.",
              "Cada nova adição (chave idempotente ainda não commitada) consulta o provider; replay commitado não depende novamente dele.",
          )
          Path("docs/architecture.md").write_text(architecture, encoding="utf-8")
          PY
          python /tmp/apply_fixes.py
          python -m ruff format src/varemi_go/api/app.py src/varemi_go/persistence/sqlite.py tests/test_api.py tests/test_persistence.py
          npx prettier --write apps/web/src/app.js apps/web/src/scanner.js apps/web/src/lib/scanner-utils.js apps/web/src/lib/scanner-utils.test.js e2e/critical-cart.spec.js
      - name: Focused regressions
        run: |
          pytest --no-cov tests/test_api.py tests/test_persistence.py tests/test_barcodes.py
          npm run web:test
      - name: Full repository gates
        run: |
          ruff format --check .
          ruff check .
          mypy
          pytest
          npm run web:format:check
          npm run web:lint
          npm run web:typecheck
          npm run web:build
          python -m pip_audit
          npm audit --audit-level=high
          python -m pip check
      - name: Critical E2E
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Commit verified fixes and remove temporary workflow
        run: |
          git rm .github/workflows/lockgen.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(mvp): resolve verified PR blockers'
          git push origin HEAD:feat/first-vertical-slice
