name: lockgen

on:
  push:
    branches: [feat/first-vertical-slice]

permissions:
  contents: write

jobs:
  generate-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/first-vertical-slice
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Generate Python lock
        run: |
          python -m pip install 'hatchling>=1.27,<2' -e '.[dev]'
          python -m pip freeze --exclude-editable | LC_ALL=C sort > requirements.lock
      - name: Generate npm lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit locks
        run: |
          if git diff --quiet -- package-lock.json requirements.lock && git ls-files --error-unmatch package-lock.json requirements.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json requirements.lock
          git commit -m 'chore(deps): lock dependency graphs'
          git push origin HEAD:feat/first-vertical-slice
