name: web-format-diagnostic

on:
  push:

permissions:
  contents: read

jobs:
  web-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx prettier --write apps/web e2e playwright.config.js package.json eslint.config.js && git diff --exit-code
