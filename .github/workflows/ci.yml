name: ci-format-diagnostic

on:
  push:

permissions:
  contents: read

jobs:
  backend-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.16.3
      - run: ruff format . && git diff --exit-code

  web-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run web:format:write --if-present || npx prettier --write apps/web e2e playwright.config.js package.json eslint.config.js
      - run: git diff --exit-code
